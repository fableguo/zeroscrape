[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-scraper-mcp"
version = "0.1.0"
description = "Self-Healing Web Scraping Model Context Protocol (MCP) Server for AI Agents"
readme = "README.md"
authors = [{ name = "Nexus-Scraper Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "scraping", "playwright", "ai-agents", "openclaw", "hermes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "fastmcp>=0.4.1,<1.0.0",
    "playwright>=1.43.0",
    "pydantic>=2.7.0,<3.0.0",
    "aiosqlite>=0.20.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
nexus-scraper = "src.mcp_server.server:mcp.run"

[project.urls]
Homepage = "https://github.com/your-username/nexus-scraper-mcp"
Repository = "https://github.com/your-username/nexus-scraper-mcp"
Issues = "https://github.com/your-username/nexus-scraper-mcp/issues"
